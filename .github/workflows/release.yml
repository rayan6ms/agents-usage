name: Release packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-x11-dev
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      - run: ./tools/selftest.py

  windows:
    needs: verify
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      - run: cargo build --release --locked
      - shell: pwsh
        run: ./tools/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agents-usage-windows-x86_64
          path: dist/packages/*.zip
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: rustup target add x86_64-apple-darwin
      - run: cargo test --locked
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - run: |
          mkdir -p target/universal2/release
          lipo -create \
            target/aarch64-apple-darwin/release/agents-usage \
            target/x86_64-apple-darwin/release/agents-usage \
            -output target/universal2/release/agents-usage
      - run: ./tools/package-macos.sh target/universal2/release/agents-usage
      - uses: actions/upload-artifact@v4
        with:
          name: agents-usage-macos-universal
          path: |
            dist/packages/*.zip
            dist/packages/*.dmg
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils flatpak libfontconfig1-dev librsvg2-common libxkbcommon-x11-dev podman rpm uidmap
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - run: ./tools/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: agents-usage-linux-x86_64
          path: |
            dist/packages/*
            dist/agents-usage-*-linux-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Agents Usage ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
