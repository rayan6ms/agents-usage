name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-x11-dev
      - run: cargo test --locked
      - run: cargo clippy --locked -- -D warnings
      - run: ./tools/selftest.py

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile-android/*.gradle
            mobile-android/gradle/wrapper/gradle-wrapper.properties
            mobile-android/app/*.gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - run: ./mobile-android/gradlew --no-daemon -p mobile-android testDebugUnitTest lintDebug assembleDebug

  android-emulator:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            abi: x86
            task: pixel2Api26DebugAndroidTest
          - api: 36
            abi: x86_64
            task: pixel6Api36DebugAndroidTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            mobile-android/*.gradle
            mobile-android/gradle/wrapper/gradle-wrapper.properties
            mobile-android/app/*.gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools emulator platforms;android-36 system-images;android-${{ matrix.api }};google_apis;${{ matrix.abi }}"
      - name: Enable KVM for the managed emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: ./mobile-android/gradlew --no-daemon -p mobile-android ${{ matrix.task }}
