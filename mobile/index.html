<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202124">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Agents Usage</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main class="app-shell" aria-live="polite">
    <header class="app-header">
      <img class="bot-icon" src="./icon.svg" alt="">
      <h1>Agents usage</h1>
      <span id="live-status" class="live-status" aria-label="Connection status"></span>
      <button id="refresh" class="icon-button" type="button" aria-label="Refresh usage">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.1 6.6L3 16m0 0v5m0-5h5M3 12A9 9 0 0 1 18.1 5.4L21 8m0 0V3m0 5h-5"/></svg>
      </button>
    </header>
    <section id="notice" class="notice" hidden></section>
    <section id="accounts" class="accounts">
      <div class="loading">Connecting to the desktop…</div>
    </section>
    <footer><span id="updated">Waiting for desktop</span></footer>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
