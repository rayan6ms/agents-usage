[package]
name = "agents-usage"
version = "0.4.4"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Lightweight tray utility for coding-agent account usage"
license = "GPL-3.0-only"
repository = "https://github.com/rayan6ms/agents-usage"

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit-x11",
    "renderer-femtovg",
    "accessibility",
    "unstable-winit-030",
] }
tokio = { version = "1.53", default-features = false, features = [
    "rt",
    "sync",
    "time",
    "macros",
    "process",
    "io-util",
    "net",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
copypasta = { version = "0.10", default-features = false, features = ["x11"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
aes-gcm = "0.10"
base64 = "0.22"
scrypt = "0.11"
whoami = "1.6"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3.6"
raw-window-handle = "0.6"
secret-service = { version = "5.1", default-features = false, features = ["rt-tokio-crypto-rust"] }
x11rb = "0.14.0"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = "0.24.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Storage_FileSystem"] }

[build-dependencies]
slint-build = "=1.17.1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false
